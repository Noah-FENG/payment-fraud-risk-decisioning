[project]
name = "payment-fraud-risk"
version = "0.1.0"
description = "Temporal payment fraud analytics and review policy research on IEEE-CIS"
requires-python = ">=3.11,<3.13"
dependencies = [
  "duckdb>=1.2,<2",
  "pandas>=2.2,<3",
  "numpy>=2.0,<2.3",
  "pyarrow>=18,<24",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
  "matplotlib>=3.9,<4",
  "shap>=0.47,<1",
  "joblib>=1.4,<2",
  "psutil>=6,<8",
  "scipy>=1.13,<1.16",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
notebooks = ["jupyterlab>=4,<5", "nbclient>=0.10,<1", "ipykernel>=6,<8"]
data = ["kaggle>=2,<3"]

[project.scripts]
fraud = "fraud.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fraud"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
